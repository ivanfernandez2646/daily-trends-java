spring.application.name=daily-trends
spring.profiles.default=dev

server.port=5000
server.compression.enabled=true
spring.threads.virtual.enabled=true

daily-trends.timezone=Europe/Madrid
daily-trends.scraping.timeout=10s
daily-trends.scraping.cooldown=300s
spring.web.resources.add-mappings=false

springdoc.api-docs.version=openapi_3_1
springdoc.paths-to-match=/status,/feed/**
# The 500 is added to every operation by OpenApiConfiguration; the advice must not add its own.
springdoc.override-with-generic-response=false
